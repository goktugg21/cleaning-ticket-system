services:
  db:
    image: postgres:16-alpine
    container_name: cleaning_ticket_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: cleaning_ticket_redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cleaning_ticket_mailhog
    ports:
      # SMTP stays on every interface: crmtest's own containers post to
      # it across the docker gateway (`EMAIL_HOST=172.18.0.1:1025` in the
      # prod .env), so binding this to 127.0.0.1 would silently stop the
      # test site sending anything. It accepts mail; it hands none back.
      - "1025:1025"
      # W-VIEWER §17 — THE UI IS LOOPBACK ONLY.
      #
      # MailHog has no authentication of its own: anyone who reaches this
      # port reads every message the system has ever sent, password-reset
      # and invitation links included. It was published on 0.0.0.0, which
      # on a host with a public interface is that whole archive, open.
      #
      # The ONLY front door is now the host nginx `/mailhog/` block
      # (`scripts/host-nginx-osius.conf`), which is behind HTTP basic
      # auth and proxies to 127.0.0.1:8025 — reachable from the host, and
      # from nowhere else.
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: ./backend
    container_name: cleaning_ticket_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    healthcheck:
      # Python urllib is used because the slim base image ships without
      # wget/curl. The probe only needs to exit 0/1 — no body parsing.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live',timeout=3).getcode()==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./backend
    container_name: cleaning_ticket_worker
    command: celery -A config worker -l info
    user: app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ./backend
    container_name: cleaning_ticket_beat
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    user: app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
