name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same ref on PRs (a force-push or new
# commit supersedes any earlier in-flight run). main pushes don't
# share a ref with each other so they are unaffected.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # P-19 Part C — the shard PLAN, checked before anything runs.
  #
  # `--parallel` alone was not enough: the merge commit's run was killed
  # at 50m22s by `timeout-minutes: 50` while the full suite needs ~5.9 h
  # serially (P-16: 6077 tests in 21268 s). The suite is now fanned across
  # the shards in `backend/ci_shards.json`, each shard still using
  # `--parallel` inside itself.
  #
  # Sharding introduces a failure mode a single `manage.py test` never
  # had: an app missing from the plan is silently never tested and CI
  # still goes green. `ci_shard_check.py` derives the apps that own tests
  # and fails HERE, before any shard starts, if the plan does not cover
  # each of them exactly once. The matrix reads the same JSON, so there
  # is one source and no second hand-maintained copy.
  # ---------------------------------------------------------------------
  backend-plan:
    name: Backend shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the plan covers every app with tests
        id: plan
        working-directory: backend
        run: |
          python ci_shard_check.py
          echo "matrix=$(python -c 'import json,sys; sys.stdout.write(json.dumps(json.load(open("ci_shards.json"))))')" >> "$GITHUB_OUTPUT"

  backend-shard:
    name: Backend shard (${{ matrix.shard.name }})
    needs: backend-plan
    runs-on: ubuntu-latest
    # Each shard is a fraction of the suite and still uses `--parallel`
    # inside itself, so 40 minutes is a wide margin rather than a ceiling
    # anything is expected to approach. If a shard ever nears it, split
    # that shard in ci_shards.json rather than raising this.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.backend-plan.outputs.matrix) }}

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cleaning_ticket_db
          POSTGRES_USER: cleaning_ticket_user
          POSTGRES_PASSWORD: ci-dummy-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleaning_ticket_user -d cleaning_ticket_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Settings.py reads each value via os.environ.get; matching the
      # docker-compose env names directly avoids a settings rewrite.
      # DEBUG=True keeps the security validator out of the way (it only
      # raises when DEBUG=False, and it would reject the dummy values
      # below). Tests still run with the same code paths as production
      # because manage.py test does not branch on DEBUG.
      DJANGO_SECRET_KEY: ci-dummy-secret-do-not-use-in-prod
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_LOG_LEVEL: WARNING
      POSTGRES_DB: cleaning_ticket_db
      POSTGRES_USER: cleaning_ticket_user
      POSTGRES_PASSWORD: ci-dummy-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CELERY_TASK_ALWAYS_EAGER: "True"
      DJANGO_TEST: "1"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DEFAULT_FROM_EMAIL: ci@example.com
      # Sentry is opt-in; an empty DSN keeps the SDK as a no-op.
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Verify migrations are checked in
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite (shard ${{ matrix.shard.name }})
        working-directory: backend
        # `--parallel` fans this shard's apps across the runner's CPUs
        # (Django clones the test DB per worker). The tests are hermetic
        # (APITestCase with per-test data, real Postgres) so parallel
        # DB-cloning is safe.
        run: |
          echo "::notice::shard ${{ matrix.shard.name }} -> ${{ matrix.shard.apps }}"
          python manage.py test ${{ matrix.shard.apps }} \
            --noinput --verbosity=1 --parallel

  # ---------------------------------------------------------------------
  # The AGGREGATE. Its name is unchanged on purpose: "Backend (Django,
  # Postgres, Redis)" is the required status check the repo already
  # expects, and renaming it would leave that check permanently pending.
  # It is green only when the plan held and every shard passed.
  # ---------------------------------------------------------------------
  backend-test:
    name: Backend (Django, Postgres, Redis)
    needs: [backend-plan, backend-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        run: |
          plan="${{ needs.backend-plan.result }}"
          shards="${{ needs.backend-shard.result }}"
          echo "plan=$plan  shards=$shards"
          if [ "$plan" != "success" ]; then
            echo "::error::the shard plan did not pass ($plan) - no shard ran"
            exit 1
          fi
          if [ "$shards" != "success" ]; then
            echo "::error::at least one backend shard did not pass ($shards)"
            exit 1
          fi
          echo "every backend shard passed"

  frontend-build:
    name: Frontend (lint, tsc, vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Match the version the local dev environment uses (Node 24
          # via nvm). The frontend Dockerfile pins node:22-alpine for
          # the production image; CI uses 24 so we shake out any LTS
          # mismatches before they reach the image.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (informational)
        # `npm run lint` runs the project's existing flat-config ESLint.
        # The codebase has 33 pre-existing errors (mostly hooks rules
        # and unused-var warnings) that pre-date the CI sprint; failing
        # the job on those would block every PR until a dedicated
        # cleanup batch lands. The step still runs on every PR so its
        # output appears in the run summary — it just doesn't gate the
        # merge. Once the existing errors are cleared in a follow-up,
        # remove `continue-on-error` to make lint required.
        continue-on-error: true
        run: npm run lint

      - name: TypeScript + Vite build
        # `npm run build` is the canonical script and runs `tsc -b &&
        # vite build`. The chunk-size warning above 500 KB is expected
        # (recharts is route-split into ReportsPage); it does NOT cause
        # a non-zero exit.
        run: npm run build
