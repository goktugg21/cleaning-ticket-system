# Host-level nginx for crmticket — front door on port 80.
#
# Topology after this change:
#   NPM / browser -> HOST nginx :80 -> docker frontend (127.0.0.1:8080) -> backend:8000
#
# Purpose: /healthz is answered DIRECTLY by the host (not docker), so the
# server liveness check returns 200 independently of the app container —
# e.g. it stays green during a frontend container recreate/rebuild.
#
# Install: see scripts/ runbook / the chat instructions. Deployed to
# /etc/nginx/sites-available/osius.conf and symlinked into sites-enabled,
# replacing the default site.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    # Sprint 125 — raise to clear the 25 MB customer-document upload cap
    # (kept in lockstep with the docker frontend's own nginx.conf). The
    # upstream NGINX Proxy Manager must also allow >=25M.
    client_max_body_size 30M;

    # Host-level liveness — served directly, no docker round-trip.
    # Returns 200 even if the app container is busy or recreating.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ---------------------------------------------------------------
    # W-PLANTRUTH Task 6 — the captured mailbox, for the owner.
    #
    # crmtest does not send real mail. Its `.env` points Django's SMTP
    # backend at EMAIL_HOST=172.18.0.1:1025 — the docker gateway — which
    # is the DEV stack's MailHog listening on the host. So every message
    # crmtest "sends" is sitting in MailHog, and until now the only way
    # to read it was to reach port 8025 directly.
    #
    # 8025 IS NOT A PUBLIC PORT AND MUST NOT BECOME ONE. MailHog has no
    # authentication of its own: anyone who reaches it reads every
    # message the system has ever sent, including password-reset and
    # invitation links. This block is the ONLY front door, and it is
    # behind HTTP basic auth.
    #
    # Why a plain sub-path proxy is enough, and MailHog needs no
    # reconfiguring: its UI asks for its assets RELATIVELY ("css/...",
    # "js/...", "images/..."), its API host is the empty string so every
    # call resolves against the current path, and its websocket is built
    # from `location.pathname`. Under /mailhog/ all three resolve to
    # /mailhog/... and come straight back here. Measured, not assumed.
    # Port 8025 keeps working exactly as it did for anything already
    # using it.
    #
    # The password file is NOT in this repo and never should be. Create
    # it on the host before installing this config:
    #     sudo htpasswd -c /etc/nginx/.htpasswd-mailhog <username>
    location /mailhog/ {
        auth_basic "crmtest mailbox";
        auth_basic_user_file /etc/nginx/.htpasswd-mailhog;

        # Trailing slash on both sides: /mailhog/foo -> /foo upstream.
        proxy_pass http://127.0.0.1:8025/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # The message list updates live over a websocket; without these
        # two the inbox still works, it just stops refreshing by itself.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Everything else -> docker frontend container, bound to localhost:8080.
    # The container's own nginx still handles /api, /static, /django-admin
    # and the SPA fallback exactly as before.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Preserve the scheme NPM already set upstream (https); pass it
        # through so Django's is_secure()/CSRF stay correct.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_read_timeout 300s;
    }
}
